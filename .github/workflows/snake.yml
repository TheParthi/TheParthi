#
# Renders the contribution graph as a snake eating the commit squares, and
# publishes the result to the `output` branch. The README points at that
# branch, so the images 404 until this has run at least once.
#
name: Generate Snake

on:
  schedule:
    # Once a day. The graph only changes when contributions do.
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          # Resolves to the repository owner, so this needs no editing.
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
