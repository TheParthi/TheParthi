#
# Keeps the profile alive.
#
#   cards  - runs scripts/build.py, which redraws every card in assets/ and
#            pulls the activity and languages cards from the GitHub API, then
#            commits whatever changed.
#   snake  - renders the contribution graph as a snake, in the same indigo to
#            cyan ramp as the activity heatmap, onto the `output` branch.
#
# Pushes made with GITHUB_TOKEN do not trigger workflows, so the nightly
# commit from `cards` cannot loop back into another run.
#
name: Profile

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/src/**"
      - ".github/workflows/profile.yml"

concurrency:
  group: profile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only; nothing to install.
      - name: Draw the cards
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit anything that changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh profile cards"
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4F46E5&color_dots=#EBEDF0,#C7D2FE,#818CF8,#6366F1,#4338CA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67E8F9&color_dots=#172036,#312E81,#4F46E5,#818CF8,#67E8F9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
