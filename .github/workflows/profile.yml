#
# Keeps the profile alive.
#
#   cards  - runs scripts/build.py, which redraws every card in assets/ and
#            pulls the activity and languages cards from the GitHub API, then
#            commits whatever changed.
#
# There used to be a snake job here. It is gone on purpose: the snake was the
# heaviest animated asset on the page (hundreds of CSS-animated cells), and it
# was a third contribution graph next to the activity card and GitHub's own.
#
# Pushes made with GITHUB_TOKEN do not trigger workflows, so the nightly
# commit from `cards` cannot loop back into another run.
#
name: Profile

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/src/**"
      - ".github/workflows/profile.yml"

concurrency:
  group: profile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only; nothing to install.
      - name: Draw the cards
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit anything that changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh profile cards"
            git push
          fi

