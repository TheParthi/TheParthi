<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Parthiban Gunasekaran — Full Stack Developer">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111A33"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="typeClip"><rect x="64" y="236" width="0" height="34">
      <animate attributeName="width"
               values="0;416;416;0;385;385;0;364;364;0"
               keyTimes="0;0.18;0.31;0.32;0.50;0.65;0.66;0.84;0.99;1"
               dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="sheenClip"><rect x="60" y="92" width="700" height="80"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#panel)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- Aurora. Slow drift so the banner is alive without being busy. -->
    <g filter="url(#soft)">
      <ellipse cx="240" cy="90" rx="260" ry="170" fill="url(#blobA)">
        <animate attributeName="cx" values="240;380;240" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;150;90" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="980" cy="250" rx="280" ry="180" fill="url(#blobB)">
        <animate attributeName="cx" values="980;840;980" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;160;250" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="650" cy="40" rx="240" ry="150" fill="url(#blobC)">
        <animate attributeName="cx" values="650;560;650" dur="24s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Availability pill -->
    <g transform="translate(64,46)">
      <rect x="0" y="0" width="186" height="30" rx="15" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.45"/>
      <circle cx="19" cy="15" r="4.5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="33" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.1" fill="#6EE7B7">OPEN TO SDE ROLES</text>
    </g>

    <!-- Name -->
    <text x="62" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="url(#nameFill)">Parthiban Gunasekaran</text>

    <!-- Sheen sweeping over the name -->
    <g clip-path="url(#sheenClip)">
      <rect x="-320" y="92" width="200" height="80" fill="url(#sheen)" transform="skewX(-22)">
        <animate attributeName="x" values="-320;1000;1000" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Accent rule -->
    <rect x="64" y="178" width="132" height="4" rx="2" fill="url(#rule)">
      <animate attributeName="width" values="0;132" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>

    <!-- Role -->
    <text x="64" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3.6" fill="#94A3B8">FULL STACK DEVELOPER</text>

    <!-- Typed line. Three phrases on a 15s loop, each clipped in. -->
    <g clip-path="url(#typeClip)">
      <text x="64" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A5B4FC" opacity="0">
        <tspan fill="#64748B">$ </tspan>ship --react-native --nestjs --postgis
        <animate attributeName="opacity" values="1;1;0;0;0;0;0" keyTimes="0;0.31;0.32;0.65;0.66;0.99;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="64" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A5B4FC" opacity="0">
        <tspan fill="#64748B">$ </tspan>build --ai-agents --rag --langgraph
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.32;0.33;0.65;0.66;0.99;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="64" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A5B4FC" opacity="0">
        <tspan fill="#64748B">$ </tspan>secure --genai --threat-detection
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.32;0.33;0.66;0.67;0.99;1" dur="15s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- Caret -->
    <rect y="240" width="2.5" height="24" fill="#67E8F9">
      <animate attributeName="x"
               values="68;484;484;68;453;453;68;432;432;68"
               keyTimes="0;0.18;0.31;0.32;0.50;0.65;0.66;0.84;0.99;1"
               dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Orbit motif -->
    <g transform="translate(1010,170)" opacity="0.9">
      <circle r="96" fill="none" stroke="#64748B" stroke-opacity="0.75" stroke-width="1"/>
      <circle r="66" fill="none" stroke="#64748B" stroke-opacity="0.60" stroke-width="1"/>
      <circle r="36" fill="none" stroke="#64748B" stroke-opacity="0.45" stroke-width="1"/>
      <circle r="13" fill="#818CF8" fill-opacity="0.95"/>
      <circle r="11" fill="none" stroke="#818CF8" stroke-width="1">
        <animate attributeName="r" values="11;30;11" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <g>
        <circle cx="96" cy="0" r="7" fill="#67E8F9"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="66" cy="0" r="6" fill="#A855F7"/>
        <animateTransform attributeName="transform" type="rotate" from="140" to="500" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="36" cy="0" r="5" fill="#F472B6"/>
        <animateTransform attributeName="transform" type="rotate" from="300" to="-60" dur="6.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
</svg>
